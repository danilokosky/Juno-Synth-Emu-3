name: Build Native Android APK (Kotlin + C++ NDK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release Native APKs
        working-directory: ./android
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace
          else
            gradle assembleDebug assembleRelease --stacktrace
          fi

      - name: Upload Native Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hera-Juno60-Native-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Native Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Hera-Juno60-Native-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
