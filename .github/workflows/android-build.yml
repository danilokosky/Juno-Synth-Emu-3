name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar manualmente com 1 clique pela aba Actions

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Setup NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "cmake;3.22.1" "ndk;26.1.10909125" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK Asset
        run: |
          mkdir -p release-assets
          echo "Procurando arquivo APK gerado pelo Gradle..."
          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERRO: Nenhum arquivo APK foi encontrado no diretório de compilação!"
            find . -type d -name "build"
            exit 1
          fi
          echo "APK encontrado com sucesso em: $APK_FILE"
          cp "$APK_FILE" release-assets/Hera-Juno-Synth-debug.apk
          ls -lh release-assets/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hera-Juno-Synth-Debug-APK
          path: release-assets/Hera-Juno-Synth-debug.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest-apk
          name: "Hera Juno Synthesizer (Android APK)"
          body: |
            ### 📱 Hera Juno Synthesizer - Pacote APK Android (Debug)
            Compilado automaticamente pelo GitHub Actions.

            #### 📥 Instalação Direta no Celular:
            1. Baixe o arquivo **`Hera-Juno-Synth-debug.apk`** abaixo diretamente pelo navegador do seu celular Android.
            2. Toque no arquivo baixado para instalar (ative a permissão para instalar apps desconhecidos no navegador se solicitado).
            3. Abra o app, conecte seu teclado controlador via USB-OTG ou Bluetooth MIDI e toque à vontade!
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/Hera-Juno-Synth-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
