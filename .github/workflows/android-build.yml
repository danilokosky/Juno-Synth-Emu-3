name: Build Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar manualmente pela aba Actions

jobs:
  build-apk:
    name: Compile Android APK (C++ NDK + Kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Setup NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "cmake;3.22.1" "ndk;26.1.10909125" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hera-Juno-Synth-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
